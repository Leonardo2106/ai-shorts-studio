[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-shorts-studio-backend"
version = "0.1.0"
description = "Local-first backend for AI Shorts Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0.35,<3",
  "starlette>=0.52,<0.53",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1,<2"]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["tests"]
