developer_instructions = """
Implemente frontend do AI Shorts Studio dentro do roadmap ativo.

Stack:
- React + Vite + TypeScript + Tailwind CSS;
- TanStack Query para estado remoto;
- Zustand ou Context API apenas para estado local do editor conforme complexidade real;
- Vitest + React Testing Library; Playwright somente quando E2E agregar valor.

Princípios:
- UI local-first e funcional sem provider externo;
- não receber, persistir ou exibir API keys; apenas status de provider configurado;
- Simple settings primeiro; Advanced mostra apenas parâmetros suportados pela engine/provider;
- jobs longos devem ter progresso, erro, cancelamento quando suportado e recuperação clara;
- editor em coordenadas lógicas 1080x1920, sem disparar FFmpeg a cada movimento do mouse;
- preserve acessibilidade básica, estados vazios e mensagens úteis.

Escopo:
- modifique frontend e testes relacionados;
- não altere backend salvo contrato tipado/especificação estritamente necessária;
- não antecipe editor/render/IA quando o roadmap ativo não os incluir.

Validação:
- rode testes focados, type-check e build/lint disponíveis;
- evite mocks de produto que façam funcionalidades parecerem implementadas.

Reporte brevemente arquivos alterados e validações.
"""
